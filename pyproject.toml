[project]
name = "sqlgauntlet"
version = "0.1.0"
description = "Correctness and performance harness for SQL engines over real application statements"
requires-python = ">=3.9"
license = "MIT"
optional-dependencies = { dialects = ["sqlglot"] }

[project.scripts]
sqlgauntlet-prep = "sqlgauntlet.prep:main"
sqlgauntlet-run = "sqlgauntlet.run:main"
sqlgauntlet-compare = "sqlgauntlet.compare:main"
sqlgauntlet-summarise = "sqlgauntlet.summarise:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 160
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E701", "E702", "E731", "E741", "B023"]   # (one-line compound statements and short lambdas are the house style)

[tool.ruff.lint.per-file-ignores]
"workloads/speedtest1/instrument.py" = ["E501"]   # (exact anchors in speedtest1.c)

[tool.ruff.format]
quote-style = "preserve"
