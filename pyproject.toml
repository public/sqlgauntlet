[project]
name = "sqlbench"
version = "0.1.0"
description = "Correctness and performance harness for SQL engines over real application statements"
requires-python = ">=3.9"
license = "MIT"
optional-dependencies = { dialects = ["sqlglot"] }

[project.scripts]
sqlbench-prep = "sqlbench.prep:main"
sqlbench-run = "sqlbench.run:main"
sqlbench-compare = "sqlbench.compare:main"
sqlbench-summarise = "sqlbench.summarise:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]
