<title>SQLite Query Corpus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a library catalogue — filters on the left, the card index in the middle, the open record on the right;
   stacks to one column on a phone, where the record opens over the list. */
:root {
  --bg: #f3f4f1; --panel: #ffffff; --ink: #1d2422; --muted: #5d6763; --line: #d9ddd6; --soft: #e9ece6;
  --accent: #1f6f5c; --accent-ink: #ffffff; --accent-soft: #d6ebe4;
  --code-bg: #f7f8f5; --kw: #1f5f9f; --str: #8a4b12; --num: #7a2f8f; --com: #7b857f; --ident: #2f5d3a;
  --good: #1d7a3e; --good-soft: #dcefe2; --bad: #b0302a; --bad-soft: #f6dedc; --flat: #6b6f68; --flat-soft: #e8e9e4;
  --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --panel: #1a1f1d; --ink: #e4e8e5; --muted: #9aa49f; --line: #2c3431; --soft: #222926;
  --accent: #5fc2a6; --accent-ink: #0d1412; --accent-soft: #1d3a32;
  --code-bg: #161b19; --kw: #82b4ec; --str: #e0a463; --num: #d39ae4; --com: #7d8984; --ident: #9fd0a8;
  --good: #6fd08e; --good-soft: #1b3524; --bad: #f08a83; --bad-soft: #3c1f1d; --flat: #a3a8a2; --flat-soft: #262b28;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121614; --panel: #1a1f1d; --ink: #e4e8e5; --muted: #9aa49f; --line: #2c3431; --soft: #222926;
  --accent: #5fc2a6; --accent-ink: #0d1412; --accent-soft: #1d3a32;
  --code-bg: #161b19; --kw: #82b4ec; --str: #e0a463; --num: #d39ae4; --com: #7d8984; --ident: #9fd0a8;
  --good: #6fd08e; --good-soft: #1b3524; --bad: #f08a83; --bad-soft: #3c1f1d; --flat: #a3a8a2; --flat-soft: #262b28;
  color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding-block: 14px 10px; border-bottom: 1px solid var(--line); }
header.top h1 { font: 700 22px/1.1 var(--f-display); letter-spacing: -0.01em; margin: 0; }
header.top .facts { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
header.top .facts b { color: var(--ink); font-weight: 600; }
.cols { display: grid; grid-template-columns: 250px minmax(0, 1fr) minmax(0, 1.25fr); gap: 0; min-height: 0; }
.filters { overflow-y: auto; padding: 14px 16px 24px 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; }
.list { overflow-y: auto; border-right: 1px solid var(--line); min-width: 0; }
.detail { overflow-y: auto; padding: 18px 0 40px 22px; min-width: 0; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
#q { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; padding: 5px 0; border: 0; background: var(--panel); cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 1px 8px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.chip small { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .8; }
.clear { align-self: flex-start; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; text-decoration: underline; }

.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 14px; border-bottom: 1px solid var(--soft); cursor: pointer; }
.row:hover { background: var(--soft); }

.row .id { font: 500 13px/1.35 var(--f-mono); overflow-wrap: anywhere; }

.pill { display: inline-block; padding: 0 6px; border-radius: 4px; font: 600 11.5px/1.6 var(--f-mono); font-variant-numeric: tabular-nums; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

.detail h2.mono { font: 600 17px/1.3 var(--f-mono); }
.detail .crumb { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.detail .crumb button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
.detail p.note { max-width: 70ch; margin: 0 0 14px; }
.detail .mod { max-width: 70ch; margin: -6px 0 14px; padding: 8px 10px; background: var(--soft); border-radius: 6px; font-size: 13px; }
.facts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 0 0 16px; }
.facts-grid div { background: var(--panel); padding: 8px 10px; }
.facts-grid dt { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.facts-grid dd { margin: 2px 0 0; font: 600 15px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.section { margin: 18px 0 0; }
.section h3 { font: 600 13px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
.section h3 .actions { margin-left: auto; display: flex; gap: 6px; text-transform: none; letter-spacing: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
pre.code { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow: auto; font: 12.5px/1.55 var(--f-mono); white-space: pre; tab-size: 2; max-height: 70vh; }
pre.code.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
.k { color: var(--kw); font-weight: 600; } .s { color: var(--str); } .n { color: var(--num); } .c { color: var(--com); font-style: italic; } .i { color: var(--ident); } .b { color: var(--accent); font-weight: 600; }
table.kv { border-collapse: collapse; font-size: 13px; width: 100%; }
table.kv td { border-top: 1px solid var(--soft); padding: 5px 8px 5px 0; vertical-align: top; }
table.kv td:first-child { font-family: var(--f-mono); color: var(--muted); white-space: nowrap; width: 1%; }
table.kv td:last-child { font-family: var(--f-mono); overflow-wrap: anywhere; }
.tb { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.tb .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); }
.tb .card h4 { margin: 0 0 6px; font: 600 12px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tb .card .big { font: 700 22px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.tb .card .meta { color: var(--muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.taglist { display: flex; flex-wrap: wrap; gap: 5px; }
.small { color: var(--muted); font-size: 12px; }
ul.ev { margin: 0; padding-left: 18px; max-width: 75ch; } ul.ev li { margin: 0 0 6px; }
.projgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.pcard { text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.pcard:hover { border-color: var(--accent); }
.pcard b { font: 600 15px/1.2 var(--f-display); }
.pcard span { color: var(--muted); font-size: 12px; }
.wave { display: inline-block; font: 600 10.5px/1.6 var(--f-mono); padding: 0 5px; border-radius: 3px; background: var(--soft); color: var(--muted); vertical-align: 2px; }
.back { display: none; }
.run textarea { width: 100%; box-sizing: border-box; min-height: 140px; resize: vertical; font: 12.5px/1.55 var(--f-mono); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); }
.run .pgrid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 8px; align-items: center; margin: 8px 0; }
.run .pgrid label { font: 12px var(--f-mono); color: var(--muted); }
.run .pgrid input { font: 12.5px var(--f-mono); padding: 4px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); min-width: 0; }
.run .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 4px 14px; }
.run .status { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.run .status b { color: var(--ink); }
.run .err { color: var(--bad); background: var(--bad-soft); border-radius: 6px; padding: 8px 10px; font: 12.5px/1.5 var(--f-mono); white-space: pre-wrap; }
.run .plan { font: 12.5px/1.6 var(--f-mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 8px 0; overflow-x: auto; white-space: pre; }
.run .grid { overflow: auto; max-height: 55vh; border: 1px solid var(--line); border-radius: 8px; }
.run table.res { border-collapse: collapse; font: 12px/1.45 var(--f-mono); font-variant-numeric: tabular-nums; }
.run table.res th { position: sticky; top: 0; background: var(--soft); text-align: left; font-weight: 600; }
.run table.res th, .run table.res td { padding: 4px 10px; border-bottom: 1px solid var(--soft); white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
.run table.res td.null { color: var(--muted); font-style: italic; }
.run table.res td.num { text-align: right; }
.hint { font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 6px; padding: 8px 10px; max-width: 70ch; }
@media (max-width: 980px) {
  .cols { grid-template-columns: 220px minmax(0, 1fr); }
  .detail { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-left: 0; }
  .app { height: auto; } .filters, .list, .detail { overflow: visible; } .list { max-height: 60vh; overflow-y: auto; }
}
@media (max-width: 640px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .filters { border-right: 0; padding-right: 0; border-bottom: 1px solid var(--line); }
  .list { border-right: 0; }
  body.open .filters, body.open .list { display: none; }
  body.open .back { display: inline-block; margin-bottom: 10px; }
}
@media (prefers-reduced-motion: no-preference) { .row, .chip, .pcard { transition: background-color .12s, border-color .12s; } }
</style>

<div class="app">
  <header class="top">
    <h1>SQLite Query Corpus</h1>
    <div class="facts" id="facts"></div>
  </header>
  <div class="cols">
    <aside class="filters" aria-label="Filters">
      <div>
        <p class="label"><label for="q">Search</label></p>
        <input id="q" type="search" placeholder="id, note, table, SQL…" autocomplete="off">
      </div>
      <div>
        <p class="label">Wave</p>
        <div class="seg" id="wave" role="group" aria-label="Wave">
          <button type="button" data-v="" aria-pressed="true">All</button>
          <button type="button" data-v="1" aria-pressed="false">1 · popular</button>
          <button type="button" data-v="2" aria-pressed="false">2 · analytics</button>
        </div>
      </div>
      <div>
        <p class="label"><label for="proj">Application</label></p>
        <select id="proj"></select>
      </div>
      <div id="tbfilter" hidden>
        <p class="label">Turbo vs stock (instructions, hot)</p>
        <div class="seg" id="tb" role="group" aria-label="Turbo outcome">
          <button type="button" data-v="" aria-pressed="true">All</button>
          <button type="button" data-v="good" aria-pressed="false">Faster</button>
          <button type="button" data-v="flat" aria-pressed="false">Par</button>
          <button type="button" data-v="bad" aria-pressed="false">Slower</button>
        </div>
        <p class="small" id="tblabel" style="margin:6px 0 0"></p>
      </div>
      <div>
        <p class="label"><label for="sort">Sort</label></p>
        <select id="sort">
          <option value="corpus">Corpus order</option>
          <option value="ms">Stock time, slowest first</option>
          <option value="ops">VDBE ops, most first</option>
          <option value="rows">Rows returned, most first</option>
          <option value="tbi" data-tb>Turbo instructions, worst first</option>
          <option value="tbg" data-tb>Turbo instructions, best first</option>
        </select>
      </div>
      <div>
        <p class="label">Tags <span id="tagmode" class="small"></span></p>
        <div class="tags" id="tags"></div>
      </div>
      <button type="button" class="clear" id="clear">Clear all filters</button>
    </aside>
    <section class="list" aria-label="Queries">
      <div class="count"><span id="count"></span><button type="button" class="clear" id="showproj">Applications</button></div>
      <div id="rows"></div>
    </section>
    <section class="detail" id="detail" aria-live="polite"></section>
  </div>
</div>

<script>
const D = /*DATA*/null;
const P = D.projects, Q = D.queries;
const byId = new Map(Q.map(q => [q.id, q]));
const st = { q: '', wave: '', proj: '', tags: new Set(), tb: '', sort: 'corpus', cur: null, fmt: true };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtN = n => n == null || n === '' ? '–' : Number(n).toLocaleString('en-GB');
const fmtMs = ms => { if (ms == null || ms === '') return '–'; const v = +ms; return v < 1 ? (v * 1000).toFixed(v < 0.01 ? 1 : 0) + ' µs' : v < 100 ? v.toFixed(2) + ' ms' : v.toFixed(0) + ' ms'; };
const cls = r => r == null ? 'none' : r < 0.98 ? 'good' : r > 1.02 ? 'bad' : 'flat';
const pill = (r, label) => r == null ? `<span class="pill none">${label || 'no run'}</span>` : `<span class="pill ${cls(r)}">×${r.toFixed(3)}</span>`;

/* SQL: a light tokenizer for colour, and a reflow for one-line statements */
const KW = new Set(('select from where and or not in is null like glob regexp match escape between exists case when then else end as on join left right inner outer cross natural using group by order having limit offset union all intersect except distinct with recursive insert into values update set delete replace upsert conflict do nothing returning create table index view trigger if primary key unique references default collate asc desc nulls first last over partition window rows range preceding following current row filter cast integer text real blob numeric begin commit rollback pragma explain query plan analyze materialized indexed temp temporary virtual fts5 fts4 using without rowid strict check constraint foreign autoincrement iif true false').split(' '));
function tokens(sql) {
  const out = []; const re = /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^']|'')*')|("(?:[^"]|"")*"|`[^`]*`|\[[^\]]*\])|(\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b|\b0x[0-9a-f]+\b)|([?:@$][A-Za-z0-9_]+|\?)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|(.)/giy;
  let m; while ((m = re.exec(sql))) {
    if (m[1]) out.push(['c', m[1]]); else if (m[2]) out.push(['s', m[2]]); else if (m[3]) out.push(['i', m[3]]);
    else if (m[4]) out.push(['n', m[4]]); else if (m[5]) out.push(['b', m[5]]); else if (m[6]) out.push([KW.has(m[6].toLowerCase()) ? 'k' : '', m[6]]);
    else out.push(['', m[7] || m[8]]);
  }
  return out;
}
const BREAK2 = new Set(['group by', 'order by', 'union all', 'left join', 'inner join', 'cross join', 'on conflict', 'partition by']);
const BREAK1 = new Set(['select', 'from', 'where', 'having', 'limit', 'union', 'intersect', 'except', 'join', 'values', 'returning', 'window', 'with']);
function reflow(toks) {   // only for statements written on one line: a new line before each main clause, indented by depth
  const out = []; let depth = 0;
  for (let i = 0; i < toks.length; i++) {
    const [c, t] = toks[i];
    if (t === '(') depth++; if (t === ')') depth = Math.max(0, depth - 1);
    if (c === 'k' && out.length) {
      const low = t.toLowerCase(); let j = i + 1; while (j < toks.length && /^\s+$/.test(toks[j][1])) j++;
      const two = toks[j] && toks[j][0] === 'k' ? low + ' ' + toks[j][1].toLowerCase() : '';
      const prev = prevWord(out).toLowerCase();
      const brk = BREAK2.has(two) || (BREAK1.has(low) && !(low === 'join' && /^(left|inner|cross|outer|natural)$/.test(prev)));
      if (brk && !BREAK2.has(prev + ' ' + low)) { while (out.length && /^\s+$/.test(out[out.length - 1][1])) out.pop(); out.push(['', '\n' + '  '.repeat(depth)]); }
    }
    out.push([c, /^\s+$/.test(t) ? (/\n/.test(t) ? t : ' ') : t]);
  }
  return out;
}
function prevWord(out) { for (let i = out.length - 1; i >= 0; i--) if (!/^\s+$/.test(out[i][1])) return out[i][1]; return ''; }
function sqlHtml(sql, fmt) {
  let t = tokens(sql); if (fmt && !/\n/.test(sql.trim())) t = reflow(t);
  return t.map(([c, s]) => c ? `<span class="${c}">${esc(s)}</span>` : esc(s)).join('');
}

/* filtering */
function hay(q) { return q._h || (q._h = (q.id + ' ' + q.note + ' ' + q.sql + ' ' + q.tags.join(' ') + ' ' + (P[q.p]?.name || '')).toLowerCase()); }
function matches(q, skipTags) {
  if (st.wave && String(P[q.p]?.wave) !== st.wave) return false;
  if (st.proj && q.p !== st.proj) return false;
  if (!skipTags) for (const t of st.tags) if (!q.tags.includes(t)) return false;
  if (st.tb) { const r = q.tb?.hot?.i; if (r == null || cls(r) !== st.tb) return false; }
  if (st.q) { const h = hay(q); for (const w of st.q.toLowerCase().split(/\s+/).filter(Boolean)) if (!h.includes(w)) return false; }
  return true;
}
function sorted(list) {
  const k = st.sort, v = q => k === 'ms' ? +(q.ms ?? -1) : k === 'ops' ? +(q.ops ?? -1) : k === 'rows' ? +(q.rows ?? -1) : k === 'tbi' ? (q.tb?.hot?.i ?? -1) : k === 'tbg' ? -(q.tb?.hot?.i ?? 99) : 0;
  return k === 'corpus' ? list : [...list].sort((a, b) => v(b) - v(a));
}

function renderTags() {
  const base = Q.filter(q => matches(q, true)), c = new Map();
  for (const q of base) for (const t of q.tags) if (!st.tags.size || [...st.tags].every(x => q.tags.includes(x))) c.set(t, (c.get(t) || 0) + 1);
  for (const t of st.tags) if (!c.has(t)) c.set(t, 0);
  const all = [...c.entries()].sort((a, b) => (st.tags.has(b[0]) - st.tags.has(a[0])) || b[1] - a[1]);
  $('#tags').innerHTML = all.map(([t, n]) => `<button type="button" class="chip" data-t="${esc(t)}" aria-pressed="${st.tags.has(t)}">${esc(t)} <small>${n}</small></button>`).join('');
  $('#tagmode').textContent = st.tags.size ? '(all of)' : '';
}
function renderList() {
  const list = sorted(Q.filter(q => matches(q)));
  $('#count').textContent = `${list.length.toLocaleString('en-GB')} of ${Q.length.toLocaleString('en-GB')} queries`;

  $('#rows').innerHTML = list.map(q => `<div class="row" role="button" tabindex="0" data-id="${esc(q.id)}" aria-current="${q.id === st.cur}">
    <span class="id">${esc(q.id)}</span>

    <span class="sub">${esc(P[q.p]?.name || q.p)} · ${fmtN(q.ops)} ops · ${fmtN(q.rows)} rows${q.note ? ' · ' + esc(q.note) : ''}</span></div>`).join('');
}
function renderFacts() {

/* detail views */
function card(title, r) {
  if (!r) return `<div class="card"><h4>${title}</h4><div class="big" style="color:var(--muted)">–</div><div class="meta">no result</div></div>`;
  const frac = r.n ? r.sv / r.n : 0;
  return `<div class="card"><h4>${title}</h4><div class="big"><span class="pill ${cls(r.i)}" style="font-size:20px">×${r.i.toFixed(3)}</span></div>
    <div class="meta">instructions vs stock · time ×${r.t.toFixed(3)}</div>
    <div class="meta">qc served ${r.sv}/${r.n} runs (${Math.round(frac * 100)} %) · stock ${fmtMs(r.ms)}</div></div>`;
}
/* the local app (serve.py): run SQL on the application's database */
let runSeq = 0;

  return `<div class="section run" data-run="${n}" data-project="${esc(project)}"><h3>${title} <span class="small" style="text-transform:none;letter-spacing:0">on ${esc(P[project]?.name || project)}’s database</span></h3>
    <textarea id="sql-${n}" spellcheck="false" aria-label="SQL to run" placeholder="SELECT name, sql FROM sqlite_schema WHERE type = 'table';">${esc(sql)}</textarea>
    ${ps.length ? `<div class="pgrid">${ps.map(([k, v], i) => `<label for="p-${n}-${i}">${esc(k)}</label><input id="p-${n}-${i}" data-k="${esc(k)}" value="${esc(v)}" spellcheck="false">`).join('')}</div><p class="small" style="margin:-2px 0 6px">Parameter values are SQL literals: quote text, as in 'abc'.</p>` : ''}
    <div class="bar"><button type="button" class="btn primary" data-act="run" data-n="${n}">Run</button>

      <label class="small"><input type="checkbox" id="noadapt-${n}"> also turbo with adapt off</label>` : ''}
      ${sql ? `<button type="button" class="btn" data-act="reset" data-n="${n}">Reset</button>` : ''}
      <span class="small">Runs inside BEGIN … ROLLBACK, so writes never stick. ⌘/Ctrl+Enter runs.</span></div>
    <div id="out-${n}"></div></div>`;
}
async function compareIt(n) {
  const box = document.querySelector(`[data-run="${n}"]`), out = $('#out-' + n), btns = box.querySelectorAll('[data-act]');
  const params = {}; for (const i of box.querySelectorAll('.pgrid input')) params[i.dataset.k] = i.value;
  const arms = ['stock', 'turbo']; if ($('#noadapt-' + n).checked) arms.push('turbo, adapt off');
  btns.forEach(b => b.disabled = true);
  out.innerHTML = `<p class="status">Comparing: checking rows, then 3 alternating rounds of hot and prep runs. The first comparison also builds the stock and turbo programs and this application's database (up to a minute).</p>`;
  try {
    const r = await (await fetch('/api/compare', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ project: box.dataset.project, sql: $('#sql-' + n).value, params, arms }) })).json();
    if (r.error) { out.innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
    const ms = v => v < 1 ? (v * 1000).toFixed(1) + ' µs' : v.toFixed(v < 10 ? 3 : 1) + ' ms';
    const ratio = (a, m) => a === 'stock' ? '<span class="small">baseline</span>' : pill(r.results[a][m].ratio);
    const served = x => x.runs ? `${Math.round(100 * x.served / x.runs)} %` : '–';
    const bad = r.arms.filter(a => !r.results[a].check.agrees);
    out.innerHTML = `
      ${bad.length ? `<div class="err">Results differ from stock: ${esc(bad.join(', '))}. ${esc(JSON.stringify(r.results[bad[0]].check))}</div>` : `<p class="status"><b>Same results</b> in every arm (${fmtN(r.results.stock.check.rows)} rows${r.results.stock.check.error !== '-' ? ', error: ' + esc(r.results.stock.check.error) : ''}${r.arms.some(a => !r.results[a].check.same_order) ? '; row order differs where the SQL leaves it open' : ''}).</p>`}
      <div class="grid"><table class="res"><thead><tr><th>Arm</th><th>Hot</th><th>vs stock</th><th>qc served</th><th>Prep</th><th>vs stock</th><th>qc served</th></tr></thead><tbody>
      ${r.arms.map(a => { const x = r.results[a]; return `<tr><td>${esc(a)}</td><td class="num">${ms(x.hot.ms)}</td><td>${ratio(a, 'hot')}</td><td class="num">${served(x.hot)}</td><td class="num">${ms(x.prep.ms)}</td><td>${ratio(a, 'prep')}</td><td class="num">${served(x.prep)}</td></tr>`; }).join('')}
      </tbody></table></div>
      <p class="small" style="margin-top:6px">Mean time per execution, median over 3 rounds; hot = prepared once, prep = prepared and finalized every time. Up to ${r.reps} executions or ${r.budget} ms per round. Turbo: ${esc(r.turbo)}; stock: SQLite 3.54.1; both through bench/corpus/corpus.c as the benchmark runs them${r.write ? ', the write inside BEGIN … ROLLBACK' : ''}. This machine's times only: no instruction counts on macOS, so a few percent is noise.</p>`;
  } catch (e) { out.innerHTML = `<div class="err">The local server didn't answer (${esc(e.message)}). Is serve.py still running?</div>`; }
  finally { btns.forEach(b => b.disabled = false); }
}
function planText(plan) {
  const kids = {};
  for (const [id, parent, , detail] of plan) (kids[parent] = kids[parent] || []).push([id, detail]);
  const lines = []; const walk = (p, d) => { for (const [id, det] of kids[p] || []) { lines.push('  '.repeat(d) + (d ? '└ ' : '') + det); walk(id, d + 1); } };
  walk(0, 0); return lines.join('\n');
}
function cell(v) {
  if (v === null) return '<td class="null">NULL</td>';
  if (typeof v === 'object' && v.blob != null) return `<td class="null" title="${esc(v.hex)}">blob ${v.blob} B</td>`;
  return typeof v === 'number' ? `<td class="num">${esc(v)}</td>` : `<td title="${esc(String(v).slice(0, 2000))}">${esc(String(v).slice(0, 300))}</td>`;
}
async function runIt(n, reps) {
  const box = document.querySelector(`[data-run="${n}"]`), out = $('#out-' + n), btns = box.querySelectorAll('[data-act="run"]');
  const params = {}; for (const i of box.querySelectorAll('.pgrid input')) params[i.dataset.k] = i.value;
  const body = { project: box.dataset.project, sql: $('#sql-' + n).value, params, reps: reps || 0, limit: 200 };
  btns.forEach(b => b.disabled = true);
  out.innerHTML = `<p class="status">Running${P[body.project] ? ' (the first run builds the database: a few seconds)' : ''}…</p>`;
  try {
    const r = await (await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();
    if (r.error) { out.innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
    const bits = [`<b>${fmtN(r.count)}</b> row${r.count === 1 ? '' : 's'}${r.truncated ? ' (first 200 shown)' : ''}`, `<b>${r.ms.toFixed(r.ms < 10 ? 3 : 1)} ms</b> first run`];
    if (r.timing) bits.push(`<b>${r.timing.median_ms.toFixed(3)} ms</b> median of ${r.timing.runs} (min ${r.timing.min_ms.toFixed(3)})`);
    if (r.changes) bits.push(`${r.changes} changes, rolled back`);
    if (r.ops) bits.push(`${fmtN(r.ops)} VDBE ops`);
    bits.push(`SQLite ${esc(r.sqlite)}`); if (r.built_s != null) bits.push(`database built in ${r.built_s} s`);
    out.innerHTML = `<p class="status">${bits.join(' · ')}</p>
      ${r.plan?.length ? `<div class="plan" aria-label="Query plan">${esc(planText(r.plan))}</div>` : r.plan_error ? `<div class="err">plan: ${esc(r.plan_error)}</div>` : ''}
      ${r.columns?.length ? `<div class="grid"><table class="res"><thead><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${r.rows.map(row => `<tr>${row.map(cell).join('')}</tr>`).join('')}</tbody></table></div>` : ''}`;
  } catch (e) { out.innerHTML = `<div class="err">The local server didn't answer (${esc(e.message)}). Is serve.py still running?</div>`; }
  finally { btns.forEach(b => b.disabled = false); }
}

$('#detail').addEventListener('click', async e => {
  const t = e.target.closest('[data-proj],[data-act],[data-addtag]'); if (!t) return;
  if (t.dataset.proj) return showProject(t.dataset.proj);
  if (t.dataset.addtag) { const g = t.dataset.addtag; st.tags.has(g) ? st.tags.delete(g) : st.tags.add(g); t.setAttribute('aria-pressed', st.tags.has(g)); return refresh(); }
  const a = t.dataset.act, q = st.cur && byId.get(st.cur);
  if (a === 'home') return showHome();
  if (a === 'back') { document.body.classList.remove('open'); return; }
  if (a === 'fmt' && q) { st.fmt = !st.fmt; t.setAttribute('aria-pressed', st.fmt); $('#sql').innerHTML = sqlHtml(q.sql, st.fmt); return; }
  if (a === 'data') { const pre = $('#data'), k = st.pv; if (pre.hidden) { pre.innerHTML = sqlHtml(P[k]?.data || '', false); pre.hidden = false; t.textContent = 'Hide'; } else { pre.hidden = true; t.textContent = 'Show'; } return; }
  if (a === 'run') return runIt(t.dataset.n, +t.dataset.reps || 0);
  if (a === 'compare') return compareIt(t.dataset.n);
  if (a === 'reset' && q) { $('#sql-' + t.dataset.n).value = q.sql; const ps = Object.values(q.params || {}); t.closest('.run').querySelectorAll('.pgrid input').forEach((i, j) => i.value = ps[j]); return; }
  if (a === 'copy' || a === 'copyblock') {
    const text = a === 'copy' ? q?.sql : P[st.pv]?.[t.dataset.src];
    try { await navigator.clipboard.writeText(text || ''); t.textContent = 'Copied'; }
    catch (err) { const el = a === 'copy' ? $('#sql') : $('#' + t.dataset.src); const rg = document.createRange(); rg.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); t.textContent = 'Selected'; }
    setTimeout(() => { t.textContent = 'Copy'; }, 1400);
  }
});

if (D.results) { $('#tbfilter').hidden = false; $('#tblabel').textContent = D.results_label; }
else for (const o of document.querySelectorAll('#sort option[data-tb]')) o.remove();
