name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx pre-commit run --all-files --show-diff-on-failure
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        cc: [gcc, clang]
        exclude:
          - os: macos-15
            cc: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # (the vendored corpus only: the fetched apps come from the corpus upstream)
      - run: make CC=${{ matrix.cc }} test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ matrix.os }}-${{ matrix.cc }}
          path: build/test/*.tsv
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: pip install sqlglot==30.27.0
      - run: make test-postgres PG_URL=postgresql://postgres@127.0.0.1:5432
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-postgres
          path: build/test-postgres/*.tsv
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install hypothesis pytest sqlglot==30.27.0
      # (the dev profile: 40 examples a property; turso and turbo need toolchains or sources CI doesn't have)
      - run: make all sqlite libsql && python3 tests/regressions.py libsql
      - run: cd python && SG_FUZZ_BACKENDS=libsql python3 -m pytest -q sqlgauntlet/fuzz/props.py -p no:cacheprovider
      - run: cd python && python3 -m sqlgauntlet.fuzz.mutate ../corpus ../build/fuzz/mutated memos atuin --per 2 && python3 -m sqlgauntlet.run check --corpus ../build/fuzz/mutated --out ../build/fuzz/mutrun --arm sqlite --arm libsql --no-report
