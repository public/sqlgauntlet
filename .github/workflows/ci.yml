name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx pre-commit run --all-files --show-diff-on-failure
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
        cc: [gcc, clang]
        exclude:
          - os: macos-14
            cc: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # (the vendored corpus only: the fetched apps need cursed-sqlite-turbo, and the turbo backend its sources)
      - run: make CC=${{ matrix.cc }} test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ matrix.os }}-${{ matrix.cc }}
          path: build/test/*.tsv
