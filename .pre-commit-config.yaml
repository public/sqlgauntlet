# pre-commit install  (or: uvx pre-commit run --all-files)
# (the corpus upstream's own files keep their bytes: docs/PROVENANCE.md)
exclude: ^(workloads/doomql/mk(port|peter)\.py$|workloads/sqldoom/(mkport\.py|mkpath\.py|pg/)|corpus/tools/|corpus/(INDEX|STATS|SURVEY)\.md$|corpus/scores\.json$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(corpus/projects/|backends/sqlite/(regexp|series|base64)\.c$)
      - id: end-of-file-fixer
        exclude: ^(corpus/projects/|backends/sqlite/(regexp|series|base64)\.c$)
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        files: ^(src|include|backends)/
        exclude: ^backends/sqlite/(regexp|series|base64)\.c$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [-s, sh]
  - repo: local
    hooks:
      - id: corpus-licences
        name: corpus licence classes (no "fetch" app committed)
        entry: python3 tools/check-corpus.py
        language: system
        pass_filenames: true
        files: ^corpus/
      - id: no-private-paths
        name: no home-directory or temp paths
        entry: sh -c 'if grep -nE "/(Users|home)/[a-z][a-z0-9_-]*/|/private/tmp/" "$@"; then echo "write ~ or a relative path instead" >&2; exit 1; fi' --
        language: system
        types: [text]
        exclude: ^(corpus/projects/|corpus/manifest[^/]*\.jsonl$|\.pre-commit-config\.yaml$)
